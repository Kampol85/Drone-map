<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Drone Flight Plan – LRF Spread A-B</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1720;--panel:#16202a;--ink:#e6ecf2;--muted:#94a3b3;--line:#2a3846;--accent:#f5a524;--ok:#3ccf8e;--warn:#fb7a45;--gps:#3b82f6;
  --font:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font)}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line);display:grid;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:700}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prog{font:500 12px var(--mono);color:var(--muted)}
.pend{font:600 11px var(--mono);color:#111;background:var(--accent);border-radius:999px;padding:2px 8px;display:none}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:5px 10px;font:600 13px var(--font);cursor:pointer}
.btn.on{background:var(--gps);border-color:var(--gps);color:#fff}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13px var(--font);cursor:pointer;border-bottom:3px solid var(--c,var(--muted))}
.day[aria-pressed="true"]{background:var(--c,#475569);color:#fff}
.main{display:grid;grid-template-columns:1fr 360px;min-height:0}
#map{min-height:0}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
@media (max-width:760px){.main{grid-template-columns:1fr;grid-template-rows:1fr 38%}aside{border-left:0;border-top:1px solid var(--line)}}
.sum{font-size:13px;color:var(--muted);margin-bottom:4px}
.near{font-size:13px;color:#93c5fd;margin-bottom:8px;min-height:0}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.row:hover,.row.sel{background:rgba(245,165,36,.12)}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row input{width:20px;height:20px;accent-color:var(--ok)}
.t{font-weight:600;font-size:14px}
.s{font:500 12px var(--mono);color:var(--muted)}
.n{font-size:12px;color:#fcd34d;margin-top:2px}
.gm{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap;padding:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.iw{font-family:var(--font);color:#15212e;font-size:13px;line-height:1.5;max-width:270px}
.iw b{font-size:14px}
.iw .k{font-family:var(--mono)}
.iw textarea{width:100%;min-height:52px;margin-top:6px;font:13px var(--font);border:1px solid #cbd5e1;border-radius:6px;padding:6px}
.iw .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.iw button,.iw a.go{border:0;border-radius:6px;padding:6px 10px;font:600 12px var(--font);cursor:pointer;text-decoration:none;display:inline-block}
.iw .pri{background:#e8890c;color:#fff}.iw .sec{background:#e2e8f0;color:#15212e}.iw .gps{background:#3b82f6;color:#fff}
.iw .flag{color:#b45309;font-weight:600}
.err{padding:24px;color:var(--warn);font-size:14px}
#ptop,#pside,#ptable{display:none}
body.printing{background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body.printing .app{display:block;height:auto}
body.printing header,body.printing aside{display:none}
body.printing #exitPrint,body.printing #printHint{display:block!important}@media print{body.printing #exitPrint,body.printing #printHint{display:none!important}html,body{background:#fff!important}}
html.printing{background:#fff}
body.printing #ptop{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:3mm;margin-bottom:4mm;width:400mm}
body.printing .main{display:grid;grid-template-columns:268mm 128mm;gap:4mm;width:400mm;height:auto}
body.printing #map{height:236mm;border:1px solid #555}
body.printing #pside{display:block;font-size:10pt}
body.printing #ptable{display:block;break-before:page;page-break-before:always;width:400mm;font-size:8.5pt}
body.printing #ptable .ptbl td,body.printing #ptable .ptbl th{padding:.5mm 1.4mm;line-height:1.25}
#pside .ptbl td:nth-child(-n+2){white-space:nowrap}
.pt2 thead{display:table-header-group}.pt2 tr{break-inside:avoid;page-break-inside:avoid}.pt2{font-size:8pt}.pt2 td.pc{font-size:7pt;width:140mm;line-height:1.2}.pt2 td:nth-child(4),.pt2 td:nth-child(10){white-space:nowrap}.pt2 td:last-child{width:40mm}.pt2 td,.pt2 th{line-height:1.2}
body.printing #pside{font-size:9.5pt}
#ptop h2{margin:0;font-size:20pt}#ptop .meta{font-size:10pt;color:#333;text-align:right;line-height:1.5}
.pbar{height:5mm;background:#e5e7eb;border-radius:3mm;overflow:hidden;margin:2mm 0 4mm}.pbar i{display:block;height:100%;background:#16a34a}
.ptbl{width:100%;border-collapse:collapse}.ptbl th,.ptbl td{border:1px solid #9ca3af;padding:1.2mm 1.6mm;text-align:left;vertical-align:top}
.ptbl th{background:#e5e7eb;font-weight:700}.ptbl td.r{text-align:right;font-variant-numeric:tabular-nums}.ptbl .ok{color:#15803d;font-weight:700}.ptbl .ip{color:#b45309;font-weight:700}
.sw{display:inline-block;width:3.5mm;height:3.5mm;border-radius:50%;vertical-align:middle;margin-right:1.5mm;border:1px solid #333}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:1mm 4mm;margin-top:3mm;font-size:9pt}
#pside h3,#ptable h3{font-size:12pt;margin:0 0 2mm}
body.printing #map,body.printing #map *{will-change:auto!important}
@page{size:A3 landscape;margin:10mm}
html.printing,body.printing{height:auto!important;overflow:visible!important}
@media print{body.printing{zoom:1!important}}

</style>

  const trs=scope.map((s,i)=>{const c=cur(s);return`<tr><td class="r">${i+1}</td><td><span class="sw" style="background:${c.flown?"#22c55e":COLORS[s.d-1]}"></span>${s.id}</td><td class="r">${s.d}</td><td>${kp(s.a)} – ${kp(s.b)}</td><td class="r">${(s.b-s.a).toLocaleString()}</td><td class="r">${s.t}</td><td class="r">#${s.bat}</td>
    <td>${c.flown?'<span class="ok">Flown</span>':"Pending"}</td><td>${esc(c.date)||"–"}</td><td>${c.lat.toFixed(6)}, ${c.lon.toFixed(6)}${moved(s)?" (moved)":""}</td><td class="pc">${s.p.length?`<b>${s.p.length}</b>${s.demco?" (incl. Demco)":""}: `+esc(s.p.join(", ")):"– (no parcel no. in source list)"}</td><td>${esc(c.note)}</td></tr>`}).join("");
  document.getElementById("ptable").innerHTML=`<h3>Launch point status – ${scope.length} points</h3><table class="ptbl pt2"><thead><tr><th>#</th><th>Point</th><th>Day</th><th>KP segment</th><th>Length (m)</th><th>Est. min</th><th>Batt.</th><th>Status</th><th>Flown date</th><th>Launch point (Lat, Lon)</th><th>Parcel numbers</th><th>Note</th></tr></thead><tbody>${trs}</tbody></table>`;
}
let printing=false;
function printA3(){
  if(printing||!map)return;printing=true;cancelMove();iw.close();buildReport();
  document.documentElement.classList.add("printing");document.body.classList.add("printing");map.setOptions({disableDefaultUI:true});
  window.scrollTo(0,0);
  setTimeout(()=>{fitDay();google.maps.event.addListenerOnce(map,"idle",()=>{fitPreview();setTimeout(()=>waitTiles(()=>window.print()),600)})},400);
}
// scale the print layout down on screen so the whole A3 map is inside the window while tiles load
// (Google Maps skips tiles that are off-screen, which left grey gaps in the printout). Reset to 1 by @media print.
function fitPreview(){const b=document.body;b.style.zoom="";const w=b.scrollWidth,h=document.getElementById("map").getBoundingClientRect().bottom+20;
  const z=Math.min(1,innerWidth/w,innerHeight/h);if(z<1)b.style.zoom=String(Math.floor(z*100)/100)}
// resolve when all map tile images are loaded and nothing changed for 1 s (max 12 s)
function waitTiles(cb){const t0=Date.now();let last=-1,stable=0;
  (function tick(){const im=[...document.querySelectorAll("#map img")];const pend=im.filter(i=>!(i.complete&&i.naturalWidth)).length;
    stable=(pend===0&&im.length===last)?stable+1:0;last=im.length;
    if(stable>=6||Date.now()-t0>20000)setTimeout(cb,300);else setTimeout(tick,250)})()}
// ⌘P / Ctrl+P goes through the same preparation as the Print A3 button
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==="p"&&!printing&&map){e.preventDefault();printA3()}});
function endPrint(){if(!printing)return;printing=false;document.body.style.zoom="";document.documentElement.classList.remove("printing");document.body.classList.remove("printing");map.setOptions({disableDefaultUI:false,streetViewControl:true,streetViewControlOptions:{position:google.maps.ControlPosition.RIGHT_BOTTOM},mapTypeControl:true,fullscreenControl:true});setTimeout(fitDay,300)}
document.getElementById("exitPrint").onclick=endPrint;
window.addEventListener("beforeprint",()=>{if(!printing&&map){printing=true;cancelMove();iw.close();buildReport();document.documentElement.classList.add("printing");document.body.classList.add("printing");map.setOptions({disableDefaultUI:true});fitDay()}});
window.gm_authFailure=()=>{document.getElementById("map").innerHTML='<div class="err">Google Maps could not load: the API key is invalid or this website is not allowed in the key\'s Application restrictions.</div>'};
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBRjDGhKxeiG98etGdHNjDGgAALVYUnaxA&callback=initMap&v=weekly&language=en&region=TH"></script>
<!-- ===== Measure tool (v3.7) — paste this whole block just above </body> ===== -->
<style>
.mz{font-family:var(--font);background:rgba(15,23,32,.92);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px;min-width:220px;max-width:300px;box-shadow:0 4px 14px rgba(0,0,0,.35);font-size:13px;line-height:1.45}
.mz .tot{font:700 18px var(--mono);color:var(--accent)}
.mz .sub{font:500 12px var(--mono);color:var(--muted)}
.mz .kp{font:500 12px var(--mono);color:#93c5fd;margin-top:2px}
.mz .hint{font-size:12px;color:var(--muted);margin-top:2px}
.mz .acts{display:flex;gap:6px;margin-top:6px}
.mz button{border:1px solid var(--line);background:#223040;color:var(--ink);border-radius:6px;padding:5px 10px;font:600 12px var(--font);cursor:pointer}
.mz button.done{background:var(--accent);border-color:var(--accent);color:#111}
.mz button:disabled{opacity:.4;cursor:default}
body.printing .mz{display:none}
</style>
<script>
(function(){
  let on=false,pts=[],verts=[],labels=[],line=null,clickL=null,panel=null,btn=null,saved=[];

  // nearest chainage on the pipeline centreline (KPP) for a point
  function nearKP(p){
    const r=Math.PI/180,R=6371000,cx=Math.cos(p.lat*r);
    const xy=q=>[(q[1]-p.lng)*cx*R*r,(q[2]-p.lat)*R*r];
    let best=null;
    for(let i=0;i<KPP.length-1;i++){
      const [ax,ay]=xy(KPP[i]),[bx,by]=xy(KPP[i+1]),dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
      let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));
      const px=ax+t*dx,py=ay+t*dy,d=Math.hypot(px,py);
      if(!best||d<best.d)best={d,m:KPP[i][0]+t*(KPP[i+1][0]-KPP[i][0])};
    }
    return best;
  }
  const ll=m=>({lat:m.getPosition().lat(),lng:m.getPosition().lng()});
  let lblIcon=null; // set in init (Google Maps loads after this script)

  function redraw(){
    pts=verts.map(ll);
    line.setPath(pts);
    labels.forEach(l=>l.setMap(null));labels=[];
    let tot=0,last=0;
    for(let i=1;i<pts.length;i++){
      last=dist(pts[i-1],pts[i]);tot+=last;
      const mid={lat:(pts[i-1].lat+pts[i].lat)/2,lng:(pts[i-1].lng+pts[i].lng)/2};
      labels.push(new google.maps.Marker({map,position:mid,icon:lblIcon,clickable:false,zIndex:200,
        label:{text:fmtDist(last),color:"#fde047",fontSize:"12px",fontWeight:"700"}}));
    }
    // cumulative total on the last vertex
    verts.forEach((v,i)=>v.setLabel(i===verts.length-1&&i>0?{text:fmtDist(tot),color:"#ffffff",fontSize:"12px",fontWeight:"700",className:"mzv"}:null));
    const k=pts.length?nearKP(pts[pts.length-1]):null;
    panel.querySelector(".tot").textContent=fmtDist(tot);
    panel.querySelector(".sub").textContent=`${pts.length} point${pts.length===1?"":"s"}${pts.length>1?" · last leg "+fmtDist(last):""}`;
    panel.querySelector(".kp").textContent=k&&k.d<2000?`Last point ≈ KP ${kp(k.m)} · ${fmtDist(k.d)} off centreline`:"";
    panel.querySelector(".hint").style.display=pts.length<2?"block":"none";
    panel.querySelector(".undo").disabled=panel.querySelector(".clr").disabled=!pts.length;
  }
  function addPt(latLng){
    const v=new google.maps.Marker({map,position:latLng,draggable:true,zIndex:201,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:6,fillColor:"#f5a524",fillOpacity:1,strokeColor:"#111",strokeWeight:2}});
    v.addListener("drag",redraw);v.addListener("dragend",redraw);
    verts.push(v);redraw();
  }
  function undo(){const v=verts.pop();if(v)v.setMap(null);redraw()}
  function clear(){verts.forEach(v=>v.setMap(null));verts=[];redraw()}

  // other map objects swallow clicks, so make them non-clickable while measuring
  function setOthersClickable(c){
    if(!c){saved=[];
      Object.values(segLines).concat(Object.values(markers),parcelObjs).forEach(o=>{if(o.get("clickable")!==false){saved.push(o);o.setOptions({clickable:false})}});
    }else{saved.forEach(o=>o.setOptions({clickable:true}));saved=[]}
  }
  function start(){
    if(on||!map)return;on=true;
    if(typeof cancelMove==="function")cancelMove();if(iw)iw.close();
    btn.classList.add("on");btn.setAttribute("aria-pressed","true");
    setOthersClickable(false);
    map.setOptions({draggableCursor:"crosshair",disableDoubleClickZoom:true});
    line=new google.maps.Polyline({map,path:[],clickable:false,zIndex:199,strokeOpacity:0,
      icons:[{icon:{path:"M 0,-1 0,1",strokeOpacity:1,strokeColor:"#f5a524",strokeWeight:3,scale:3},offset:"0",repeat:"12px"}]});
    // fast second tap arrives as "dblclick" instead of "click" — count it too
    clickL=[map.addListener("click",e=>addPt(e.latLng)),map.addListener("dblclick",e=>addPt(e.latLng))];
    map.controls[google.maps.ControlPosition.TOP_CENTER].push(panel);panel.style.display="block";
    redraw();
  }
  function stop(){
    if(!on)return;on=false;
    clear();line.setMap(null);line=null;clickL.forEach(l=>google.maps.event.removeListener(l));
    setOthersClickable(true);
    map.setOptions({draggableCursor:null,disableDoubleClickZoom:false});
    const c=map.controls[google.maps.ControlPosition.TOP_CENTER],i=c.getArray().indexOf(panel);if(i>=0)c.removeAt(i);
    btn.classList.remove("on");btn.setAttribute("aria-pressed","false");
  }

  function init(){
    lblIcon={path:google.maps.SymbolPath.CIRCLE,scale:0};
    btn=el("button",{className:"btn",id:"measureBtn",title:"Measure distance"},"📏 Measure");
    btn.setAttribute("aria-pressed","false");btn.onclick=()=>on?stop():start();
    const gps=document.getElementById("gpsBtn");gps.parentNode.insertBefore(btn,gps);
    panel=el("div",{className:"mz"});
    panel.innerHTML=`<div class="tot">0 m</div><div class="sub"></div><div class="kp"></div>
      <div class="hint">Tap the map to add points · drag a point to adjust</div>
      <div class="acts"><button class="undo">↶ Undo</button><button class="clr">Clear</button><button class="done">Done</button></div>`;
    panel.querySelector(".undo").onclick=undo;panel.querySelector(".clr").onclick=clear;panel.querySelector(".done").onclick=stop;
    document.addEventListener("keydown",e=>{if(!on||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
      if(e.key==="Escape")stop();else if(e.key==="Backspace"||(e.key==="z"&&(e.ctrlKey||e.metaKey))){e.preventDefault();undo()}});
    document.getElementById("printBtn").addEventListener("click",stop,true);
  }
  (function wait(){if(window.google&&google.maps&&typeof map!=="undefined"&&map)init();else setTimeout(wait,300)})();
})();
</script>
<!-- ===== end Measure tool ===== -->
